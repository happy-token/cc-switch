name: HappySwitch Build

on:
  workflow_dispatch:
    inputs:
      sign_macos:
        description: Sign and notarize macOS installers
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: happy-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Universal
            os: macos-14
            target: universal-apple-darwin
            bundles: app,dmg
          - name: Windows x64
            os: windows-2022
            target: x86_64-pc-windows-msvc
            bundles: msi,nsis
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
      - uses: dtolnay/rust-toolchain@stable
      - name: Install macOS targets
        if: runner.os == 'macOS'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - name: Setup pnpm
        run: |
          corepack enable
          corepack install
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Type check
        run: pnpm typecheck
      - name: Account regression tests
        run: pnpm exec vitest run tests/components/HappyTokenLoginButton.test.tsx
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          cache-on-failure: true
          key: ${{ matrix.target }}
      - name: Import Apple certificate
        if: runner.os == 'macOS' && inputs.sign_macos
        shell: bash
        env:
          CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          CERT_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$CERTIFICATE"
          printf '%s' "$CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/happyswitch.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$RUNNER_TEMP/happyswitch.keychain-db"
          security set-keychain-settings -lut 21600 "$RUNNER_TEMP/happyswitch.keychain-db"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$RUNNER_TEMP/happyswitch.keychain-db"
          security import "$RUNNER_TEMP/happyswitch.p12" -k "$RUNNER_TEMP/happyswitch.keychain-db" -P "$CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security list-keychains -d user -s "$RUNNER_TEMP/happyswitch.keychain-db" "$HOME/Library/Keychains/login.keychain-db"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$RUNNER_TEMP/happyswitch.keychain-db"
          IDENTITY=$(security find-identity -v -p codesigning "$RUNNER_TEMP/happyswitch.keychain-db" | sed -n 's/.*"\(Developer ID Application:.*\)".*/\1/p' | head -1)
          test -n "$IDENTITY"
          echo "APPLE_SIGNING_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"
          rm -f "$RUNNER_TEMP/happyswitch.p12"
      - name: Build installers
        shell: bash
        env:
          APPLE_ID: ${{ runner.os == 'macOS' && inputs.sign_macos && secrets.APPLE_ID || '' }}
          APPLE_PASSWORD: ${{ runner.os == 'macOS' && inputs.sign_macos && secrets.APPLE_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ runner.os == 'macOS' && inputs.sign_macos && secrets.APPLE_TEAM_ID || '' }}
        run: pnpm tauri build --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}
      - name: Notarize and verify macOS DMG
        if: runner.os == 'macOS' && inputs.sign_macos
        shell: bash
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          APP="src-tauri/target/universal-apple-darwin/release/bundle/macos/HappySwitch.app"
          codesign --verify --deep --strict "$APP"
          xcrun stapler validate "$APP"
          DMG=$(find src-tauri/target/universal-apple-darwin/release/bundle/dmg -name '*.dmg' -type f -print -quit)
          test -n "$DMG"
          xcrun notarytool submit "$DMG" --apple-id "$APPLE_ID" --password "$APPLE_PASSWORD" --team-id "$APPLE_TEAM_ID" --wait --timeout 30m
          xcrun stapler staple "$DMG"
          xcrun stapler validate "$DMG"
      - name: Clean up Apple certificate
        if: always() && runner.os == 'macOS' && inputs.sign_macos
        shell: bash
        run: |
          rm -f "$RUNNER_TEMP/happyswitch.p12"
          security delete-keychain "$RUNNER_TEMP/happyswitch.keychain-db" || true
      - name: Collect installers and checksums
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets
          find src-tauri/target/${{ matrix.target }}/release/bundle -type f \( -name '*.dmg' -o -name '*.msi' -o -name '*-setup.exe' \) -exec cp {} release-assets/ \;
          test -n "$(find release-assets -type f -print -quit)"
          python - <<'PY'
          import hashlib
          from pathlib import Path
          files = sorted(Path('release-assets').iterdir())
          Path('release-assets/SHA256SUMS-${{ runner.os }}.txt').write_text(''.join(hashlib.file_digest(p.open('rb'), 'sha256').hexdigest() + '  ' + p.name + '\n' for p in files))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: HappySwitch-${{ runner.os }}
          path: release-assets/*
          if-no-files-found: error
          retention-days: 14
